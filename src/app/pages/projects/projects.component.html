<section class="projects">
    <div class="header">
        <h1 class="page-title rise">
            My <span>Projects</span>
        </h1>
        <div
            class="filter rise"
            style="--i:1"
            role="group"
            aria-label="Project category"
            [attr.data-active]="selectedCategory()">
            <span class="thumb" aria-hidden="true"></span>
            <button
                type="button"
                [class.active]="selectedCategory()==='development'"
                [attr.aria-pressed]="selectedCategory()==='development'"
                (click)="showDevelopment()">
                Development
            </button>
            <button
                type="button"
                [class.active]="selectedCategory()==='design'"
                [attr.aria-pressed]="selectedCategory()==='design'"
                (click)="showDesign()">
                Design
            </button>
            <button
                type="button"
                [class.active]="selectedCategory()==='demos'"
                [attr.aria-pressed]="selectedCategory()==='demos'"
                (click)="showDemos()">
                Demo Sites
            </button>
        </div>
    </div>
    @if(selectedCategory()==='demos'){
        <p class="demos-note rise" style="--i:1">
            Fictional brands I design and build as templates, one for each of my web packages
            (Basic, Professional and Premium). Every site is live: open it and scroll.
        </p>
    }
    <div class="projects-grid scroller">
        @for(project of projects();track project.id; let i = $index){
            <app-project-card
                class="rise"
                [style.--i]="i + 2"
                [project]="project">
            </app-project-card>
        }
    </div>
</section>
