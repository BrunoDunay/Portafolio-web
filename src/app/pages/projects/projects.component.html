<section class="projects">
    <div class="header">
        <h1 class="page-title rise">
            {{ i18n.t().projects.my }} <span>{{ i18n.t().projects.title }}</span>
        </h1>
        <div
            class="filter rise"
            style="--i:1"
            role="group"
            [attr.aria-label]="i18n.t().projects.category"
            [attr.data-active]="selectedCategory()">
            <span class="thumb" aria-hidden="true"></span>
            <button
                type="button"
                [class.active]="selectedCategory()==='development'"
                [attr.aria-pressed]="selectedCategory()==='development'"
                (click)="showDevelopment()">
                {{ i18n.t().projects.development }}
            </button>
            <button
                type="button"
                [class.active]="selectedCategory()==='design'"
                [attr.aria-pressed]="selectedCategory()==='design'"
                (click)="showDesign()">
                {{ i18n.t().projects.design }}
            </button>
            <button
                type="button"
                [class.active]="selectedCategory()==='demos'"
                [attr.aria-pressed]="selectedCategory()==='demos'"
                (click)="showDemos()">
                {{ i18n.t().projects.demos }}
            </button>
        </div>
    </div>
    @if(selectedCategory()==='demos'){
        <p class="demos-note rise" style="--i:1">
            {{ i18n.t().projects.demosNote }}
        </p>
    }
    <div class="projects-grid scroller">
        @for(project of projects();track project.id; let i = $index){
            <app-project-card
                class="rise"
                [style.--i]="i + 2"
                [project]="project">
            </app-project-card>
        }
    </div>
</section>
