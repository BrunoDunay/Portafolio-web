<section class="skills">

    <div class="header">

        <h1 class="page-title rise">
            {{ i18n.t().skills.my }} <span>{{ i18n.t().skills.title }}</span>
        </h1>

        <p class="lede rise" style="--i:1">
            {{ i18n.t().skills.lede }}
        </p>

    </div>

    <div class="skills-container scroller">

        @for (group of groups(); track group.key) {
            <section class="group">

                <h2 class="group-title">
                    <span class="material-icons" aria-hidden="true">{{ group.icon }}</span>
                    {{ group.title }}
                    <span class="count">{{ group.skills.length }}</span>
                </h2>

                <ul class="tiles">
                    @for (skill of group.skills; track skill.name) {
                        <li
                            class="tile"
                            [style.--c]="skill.color"
                            (pointermove)="track($event)">
                            <span class="icon">
                                <img
                                    [src]="skill.icon"
                                    [class.invert]="skill.invert"
                                    alt=""
                                    width="44"
                                    height="44"
                                    loading="lazy">
                            </span>
                            <span class="name">{{ skill.name }}</span>
                        </li>
                    }
                </ul>

            </section>
        }

    </div>

</section>
