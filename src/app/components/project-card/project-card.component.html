<a
    class="card"
    [routerLink]="['/projects', project().slug]"
    [style.--project-color]="project().brand.primary">
    <div class="cover">
        <img
            [src]="project().logo"
            alt=""
            loading="lazy">
        <span class="open material-icons" aria-hidden="true">north_east</span>
    </div>

    <div class="content">
        <span class="badge">
            {{badge()}}
        </span>

        <h3>
            {{project().title}}
        </h3>

        <p>
            {{project().shortDescription}}
        </p>

        <div class="tags">
            @for(tag of tags();track tag){
                <span>
                    {{tag}}
                </span>
            }
        </div>
    </div>
</a>
